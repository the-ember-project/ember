name: Research session

on:
  schedule:
    # Twice a day (odd minutes: GitHub delays on-the-hour runs most). RUNS_PER_DAY below must match.
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    # A session stops itself after 45 minutes and caps each command to the time left; the rest
    # is room for setup and saving, so a long session is never cut off before it saves.
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"  # show output live in the log
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Models and packages the agent downloads, kept between sessions (GitHub keeps up to 10 GB).
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/agent-cache
          key: agent-cache-${{ github.run_id }}
          restore-keys: agent-cache-

      - name: Create a separate user for the agent's commands
        run: |
          sudo useradd -m researcher
          # Remove any symlinks in the agent's folders: trusted code could follow one to a secret.
          find self knowledge research experiments -type l -print -delete 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/agent-cache" self knowledge research experiments
          # The agent's commands may write its own folders and the cache, but not its code,
          # schedule, budget ledger or the git internals.
          chmod -R a+rwX "$RUNNER_TEMP/agent-cache" self knowledge research experiments
          # Let it pass through (not list) the folders above the repo and the cache, so it can
          # run scripts by path and use the cache. It still can't read anything else there.
          for d in "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
            while [ "$d" != / ]; do sudo chmod o+x "$d"; d=$(dirname "$d"); done
          done
          # Without a pseudo-terminal, a background command doesn't hold the agent's command open.
          echo 'Defaults !use_pty' | sudo tee /etc/sudoers.d/agent-no-pty > /dev/null

      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The founder's Max plan includes $100 of API credit a month (it expires if unused), so
          # Ember gets $95 a month over two sessions a day, leaving room for the weekly review.
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD || '95' }}
          RUNS_PER_DAY: "2"
          # The lifetime fund grows by this much each month from MONTHLY_CREDIT_FROM (the day the
          # credit arrives), on top of TOTAL_FUNDS_USD. Set MONTHLY_CREDIT_USD to 0 if the plan changes.
          MONTHLY_CREDIT_USD: ${{ vars.MONTHLY_CREDIT_USD || '100' }}
          MONTHLY_CREDIT_FROM: "2026-11-26"
          DISCRETIONARY_USD: ${{ vars.DISCRETIONARY_USD }}
          GPU_WEEKLY_MINUTES: ${{ vars.GPU_WEEKLY_MINUTES }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          HELPER_MODEL: ${{ vars.HELPER_MODEL }}
          TOTAL_FUNDS_USD: ${{ vars.TOTAL_FUNDS_USD || '115' }}
          WIND_DOWN_DAYS: ${{ vars.WIND_DOWN_DAYS }}
          AGENT_TRUSTED_USERS: ${{ vars.AGENT_TRUSTED_USERS }}
          AGENT_RUN_AS: researcher
          AGENT_CACHE_DIR: ${{ runner.temp }}/agent-cache
        run: python agent/run.py

      - name: Undo changes to protected files and save the session
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stop anything the agent left running in the background (repeated, in case one respawns).
          for i in 1 2 3 4 5; do sudo pkill -KILL -u researcher || break; sleep 1; done
          git checkout HEAD -- agent .github requirements.txt reviews
          git clean -fdq -- agent .github reviews
          # Only the agent's own folders, the ledger and logs, and the transcripts are saved.
          bash .github/scripts/save.sh "Research session $(date -u +'%Y-%m-%d %H:%M')" \
            self knowledge research experiments state transcripts
