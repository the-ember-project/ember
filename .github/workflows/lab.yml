name: Lab

# Runs the long experiments the agent queued in self/lab_queue.txt. Free on public
# repositories, makes no Claude calls, and the experiments never see any secrets.

on:
  # Straight after each research session, so queued jobs don't wait on GitHub's timer, which can
  # run hours late or skip a day. The lab does nothing if the queue is empty.
  # No timed backup: it shares a queue with the sessions, where GitHub keeps only one waiting
  # run, so a late backup could knock out a waiting session. A missed queue runs after the next one.
  workflow_run:
    workflows: ["Research session"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"  # show output live in the log
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the queue
        id: queue
        run: |
          if grep -qvE '^\s*(#|$)' self/lab_queue.txt 2>/dev/null; then echo "jobs=yes" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v7
        if: steps.queue.outputs.jobs == 'yes'
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        if: steps.queue.outputs.jobs == 'yes'
        with:
          path: ${{ runner.temp }}/agent-cache
          key: agent-cache-${{ github.run_id }}
          restore-keys: agent-cache-

      - name: Create a separate user for the experiments
        if: steps.queue.outputs.jobs == 'yes'
        run: |
          sudo useradd -m researcher
          # Remove any symlinks in the agent's folders: trusted code could follow one to a secret.
          find self knowledge research experiments -type l -print -delete 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/agent-cache" self knowledge research experiments
          chmod -R a+rwX "$RUNNER_TEMP/agent-cache" self knowledge research experiments
          # Let it pass through (not list) the folders above the repo and the cache, so it can
          # run scripts by path and use the cache. It still can't read anything else there.
          for d in "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
            while [ "$d" != / ]; do sudo chmod o+x "$d"; d=$(dirname "$d"); done
          done
          # Without a pseudo-terminal, a background command doesn't hold the agent's command open.
          echo 'Defaults !use_pty' | sudo tee /etc/sudoers.d/agent-no-pty > /dev/null

      - name: Run queued experiments
        if: steps.queue.outputs.jobs == 'yes'
        env:
          AGENT_RUN_AS: researcher
          AGENT_CACHE_DIR: ${{ runner.temp }}/agent-cache
          LAB_TOTAL_MINUTES: "300"
        run: python agent/lab.py

      - name: Save the results
        if: always() && steps.queue.outputs.jobs == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do sudo pkill -KILL -u researcher || break; sleep 1; done
          # The lab only saves experiment results and its own queue and log.
          git checkout HEAD -- agent .github requirements.txt state research knowledge reviews
          git clean -fdq -- agent .github state research knowledge reviews
          bash .github/scripts/save.sh "Lab run $(date -u +'%Y-%m-%d %H:%M')" \
            experiments self/lab_queue.txt self/lab_log.md
