name: Weekly review

# A fresh Claude call reviews the past week's results and claims. It runs no agent code
# or commands, and saves only the review and the spend.

on:
  schedule:
    - cron: "0 4 * * 0"  # Sundays at 04:00 UTC, before that day's research session
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"  # show output live in the log
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # the reviewer checks each experiment's commit history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Review the week
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          TOTAL_FUNDS_USD: ${{ vars.TOTAL_FUNDS_USD || '100' }}
        run: python agent/review.py

      - name: Save the review
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "agi-research-agent"
          git config user.email "agi-research-agent@users.noreply.github.com"
          git add reviews state
          git -c core.hooksPath=/dev/null commit -qm "Weekly review $(date -u +'%Y-%m-%d')" || exit 0
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c core.hooksPath=/dev/null pull -q --rebase "$REMOTE" "${GITHUB_REF_NAME}"
          git push "$REMOTE" "HEAD:${GITHUB_REF_NAME}"
