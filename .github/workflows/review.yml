name: Weekly review

# A fresh Claude call reviews the past week's results and claims. It runs no agent code
# or commands, and saves only the review and the spend.

on:
  schedule:
    - cron: "23 4 * * 0"  # Sundays at 04:23 UTC, before that day's research session
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"  # show output live in the log
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # the reviewer checks each experiment's commit history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Remove symlinks from the agent's folders
        # The reviewer reads these folders while holding the API key; a link could point at it.
        run: find self knowledge research experiments -type l -print -delete 2>/dev/null || true

      - name: Review the week
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Keep these in step with research.yml.
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD || '95' }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          TOTAL_FUNDS_USD: ${{ vars.TOTAL_FUNDS_USD || '115' }}
          MONTHLY_CREDIT_USD: ${{ vars.MONTHLY_CREDIT_USD || '100' }}
          MONTHLY_CREDIT_FROM: "2026-11-26"
        run: python agent/review.py

      - name: Save the review
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/save.sh "Weekly review $(date -u +'%Y-%m-%d')" reviews state
